# Phase 1 hand-specified linear scoring weights (placeholder).
# Replace these with your designed formulas before running baseline scorer.
#
# equity_depth and equity_quote MUST stay separate. Quote-tier names have no
# L2 book (Part 2); they must not inherit depth_ratio / spread_bps / ofi.

equity_depth:
  depth_ratio: 0.25
  spread_bps: -0.15
  ofi: 0.35
  vwap_deviation: 0.25
  intercept: 0.0

# Depth-free. Do not add depth_ratio / spread_bps / ofi here.
equity_quote:
  vwap_deviation: 0.25
  intercept: 0.0

options:
  pcr: 0.20
  oi_buildup_long: 0.30
  oi_buildup_short: -0.30
  delta: 0.15
  gamma: 0.10
  vwap_deviation: 0.10
  intercept: 0.0

futures:
  basis_bps: -0.10
  calendar_spread: 0.10
  vwap_deviation: 0.20
  intercept: 0.0

# Score above this threshold => bullish probability mapped via sigmoid in baseline.py
score_threshold: 0.0
