# Application settings — edit paths and symbols here rather than in Python code.

paths:
  data_dir: data
  raw_dir: data/raw
  compacted_dir: data/compacted
  features_dir: data/features
  models_dir: data/models
  sqlite_db: data/nse_pipeline.db
  logs_dir: logs
  instruments_cache: config/instruments_cache.json
  membership_dir: config/membership

# Universe membership — official NSE published constituent CSVs (refreshed periodically).
# Quote-mode equities = Nifty 500 symbols minus Nifty 100 (no overlap).
universe:
  nifty100_csv_url: https://archives.nseindia.com/content/indices/ind_nifty100list.csv
  nifty500_csv_url: https://archives.nseindia.com/content/indices/ind_nifty500list.csv
  # Fallback mirrors if archives host is down.
  nifty100_csv_fallback_url: https://www.niftyindices.com/IndexConstituent/ind_nifty100list.csv
  nifty500_csv_fallback_url: https://www.niftyindices.com/IndexConstituent/ind_nifty500list.csv
  membership_max_age_days: 7

# Live index spot for Greeks / basis (INDICES segment on NSE).
index_symbols:
  - "NIFTY 50"
  - "NIFTY BANK"

# Index options only (Nifty weekly + Bank Nifty monthly). No equity options.
# Nifty monthly options are out of scope — see TRADE_OFFS.md.
options:
  exchange: NFO
  underlyings:
    - name: NIFTY
      spot_quote: "NSE:NIFTY 50"
      strikes_each_side: 10
      strike_interval: 50
      # weekly = Tuesday series only; never pool with monthly Nifty.
      series: weekly
    - name: BANKNIFTY
      spot_quote: "NSE:NIFTY BANK"
      strikes_each_side: 10
      strike_interval: 100
      # Bank Nifty weekly discontinued Nov 2024; monthly is its only series.
      series: monthly

# Index futures: near + next month for each underlying.
futures:
  exchange: NFO
  underlyings:
    - NIFTY
    - BANKNIFTY
  contract_count: 2  # near + next
  subscribe_mode: full

# Ingestion: how often to flush buffered ticks to Parquet.
ingestion:
  flush_interval_seconds: 45
  flush_max_rows: 5000
  # Per-instrument modes come from the cache (full vs quote); this is the default for depth set.
  websocket_mode: full

# After-close compaction of per-minute ticks into one file per symbol/day.
compaction:
  # If true, move ticks_*.parquet into {symbol}/_minute_parts/ after successful compact.
  archive_minute_files: false
  archive_subdir: _minute_parts

# NSE cash session (IST). Used to flag partial-coverage days so they are not
# treated as full open-to-close sessions in later analysis.
session:
  timezone: Asia/Kolkata
  market_open: "09:15"
  market_close: "15:30"
  # First tick after open+grace → late_start (partial). Last tick before close-grace → early_end.
  open_grace_minutes: 15
  close_grace_minutes: 15

# Historical candle backfill (Stage 1 short lookback + Part 1 long backfill).
# Kite historical candle endpoint: 3 requests/second. 429 → 10s cooldown.
historical:
  interval: 5minute          # used by scripts/02_run_backfill.py (Stage 1, do not change its path)
  lookback_days: 30
  equity_start_date: "2022-01-01"
  # Minute window for Part 1. null = full range from equity_start_date (confirm before scale).
  # Set to 365 for "daily full-range + minute last 12 months".
  minute_lookback_days: null
  minute_interval: minute
  daily_interval: day
  rate_limit_per_second: 3.0
  sleep_seconds: 0.40
  retry_max: 5
  retry_429_cooldown_seconds: 10.0
  # Kite per-request calendar-day caps (do not exceed).
  interval_max_days:
    minute: 60
    3minute: 100
    5minute: 100
    10minute: 100
    15minute: 200
    30minute: 200
    60minute: 400
    day: 2000

# Feature engineering (Stage 2+).
features:
  oi_bucket_minutes: 5
  # Reject a tick if |return| vs previous LTP exceeds this percent (equity / futures / index).
  max_tick_return_pct: 5.0
  # Options premiums move more (Gamma); separate looser cap. Later: moneyness/IV-aware.
  options_max_tick_return_pct: 25.0
  # Annualization day-count for futures basis (calendar days to expiry).
  basis_days_per_year: 365

# Signal / labeling (Stage 3).
# Vertical barrier = candle_interval_minutes.
# label_mode: triple_barrier (active) | next_candle_close_vs_current (legacy flat, comparison only)
signal:
  candle_interval_minutes: 5
  threshold_pct: 0.15
  label_mode: triple_barrier
  triple_barrier:
    vol_method: ewma          # ewma | rolling_std
    vol_window: 20            # lookback / ewma span in 5-min returns
    barrier_multiplier: 1.0   # thr = realized_vol × multiplier (vol as decimal)
    min_threshold_pct: 0.05   # floor
    max_threshold_pct: 5.0    # cap
    path_rule: close_vs_barriers
    # Phase B hook only — not implemented yet.
    options_label_mode: raw_premium   # future: delta_residual
  # Min prior returns required before trusting dynamic vol (else floor).
  vol_min_periods: 5

# Walk-forward backtest windows (Stage 4+). Reusable harness — not scorer-specific.
backtest:
  train_days: 20
  test_days: 5
  step_days: 5
  min_train_days: 5
  overfit_hit_rate_gap: 0.15  # flag if IS - OOS hit rate exceeds this
  annualization_days: 252
  signal_threshold: 0.0       # |score| or P(up)-0.5 gate for taking a side

# Transaction costs — tune to your broker contract.
# Options bid-ask spread-crossing is its own line item (not folded into slippage).
costs:
  equity:
    brokerage_flat: 20.0
    stt_sell_pct: 0.00025
    slippage_tick: 0.05
    slippage_pct: 0.0001
  options:
    brokerage_flat: 20.0
    stt_sell_pct: 0.0005
    slippage_ticks: 1
    tick_size: 0.05
    spread_crossing_ticks: 1
  futures:
    brokerage_flat: 20.0
    stt_sell_pct: 0.0001
    slippage_tick: 0.05
    slippage_pct: 0.00005

# Stage 5 training — include_historical_partial is per instrument class.
training:
  include_historical_partial:
    equity: true
    options: true
    futures: true
  coarse_features:
    equity:
      - vwap_deviation_bps
    options:
      - pcr
      - oi_buildup_long
      - oi_buildup_short
      - delta
      - gamma
      - vwap_deviation_bps
    futures:
      - basis_bps
      - calendar_spread_near_minus_next
      - vwap_deviation_bps
  fine_features:
    equity:
      - vwap_deviation_bps
      - depth_ratio_bid_ask
      - spread_bps
      - ofi_bucket_sum
    options:
      - pcr
      - oi_buildup_long
      - oi_buildup_short
      - delta
      - gamma
      - depth_ratio_bid_ask
      - ofi_bucket_sum
    futures:
      - basis_bps
      - calendar_spread_near_minus_next
      - vwap_deviation_bps
      - depth_ratio_bid_ask
      - ofi_bucket_sum
  blend:
    coarse_weight: 0.6
    fine_weight: 0.4

# Stage 6 maturity gate — POOLED cumulative live trading days per class, not per contract.
# Nifty weekly vs Bank Nifty monthly accumulate separately (different roll cadence).
maturity_gate:
  suppress_below_days: 10
  provisional_below_days: 60

# Stage 6 live scoring cadence.
live_signal:
  score_every_seconds: 5

# Weekly sliding-window retrain (Part 8). New models must pass the Part 5 harness
# before they are eligible to replace the live pair — never auto-promote.
retrain:
  frequency: weekly
  window_days: 60
  auto_promote: false

# WebSocket reconnect policy.
resilience:
  reconnect_initial_seconds: 2
  reconnect_max_seconds: 60
  reconnect_multiplier: 2.0
